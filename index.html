/* Custom scrollbar — matched to the site's blue accent */
html { scrollbar-width: thin; scrollbar-color: rgba(23,105,224,.52) transparent; }
html::-webkit-scrollbar { width: 7px; height: 7px; }
html::-webkit-scrollbar-track { background: transparent; }
html::-webkit-scrollbar-thumb { background: rgba(23,105,224,.48); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
html::-webkit-scrollbar-thumb:hover { background: rgba(23,105,224,.72); border: 1px solid transparent; background-clip: padding-box; }
[data-theme="dark"] { scrollbar-color: rgba(91,156,255,.58) transparent; }
[data-theme="dark"]::-webkit-scrollbar-thumb { background: rgba(91,156,255,.54); }
[data-theme="dark"]::-webkit-scrollbar-thumb:hover { background: rgba(91,156,255,.78); }

 document.getElementById('app').innerHTML=`<main class="screen"><div class="screen-inner"><header class="home-header"><div class="home-head-row"><div class="home-head-copy"><div class="kicker">ABC ԿԱՐԳԵՐ</div><h1>Տեսական հարցաշար</h1><p class="subtitle">Պատրաստվիր քննությանը՝ սովորիր թեստերով կամ անցիր 20 պատահական հարցից կազմված քննություն։</p></div><button class="theme-toggle" id="themeToggle" type="button" aria-label="Փոխել մուգ/լուսավոր ռեժիմը"></button></div></header><section class="overview"><div class="overview-item"><div class="overview-value">${totalAll}</div><div class="overview-label">Ընդհանուր հարց</div></div><div class="overview-item"><div class="overview-value">${answeredAll}</div><div class="overview-label">Պատասխանված</div></div><div class="overview-item"><div class="overview-value">${doneAll} / ${keys.length}</div><div class="overview-label">Ավարտված թեստ</div></div></section><section class="exam-mode-card"><div class="exam-mode-copy"><div class="exam-mode-kicker">ՔՆՆՈՒԹՅՈՒՆ</div><h2>20 պատահական հարց</h2><p>Բոլոր թեստերից պատահական ընտրված 20 հարց։ Ամեն նոր քննություն սկսվում է նոր հերթականությամբ։</p></div><button class="test-action primary" id="examModeBtn" type="button">Սկսել քննությունը <span aria-hidden="true">→</span></button></section><div class="tests-heading"><div><h2>Թեստեր</h2><p>Անցիր հարցաշարերը հերթականությամբ և հետևիր առաջընթացիդ։</p></div><div class="section-tools"><button class="reset-all-btn" id="resetAllBtn" type="button" aria-label="Զրոյացնել ամբողջ առաջընթացը">${icons.reset}<span>Զրոյացնել</span></button></div></div><section class="tests">${cards}</section></div></main>`;
 document.getElementById('themeToggle').onclick=toggleTheme;document.getElementById('examModeBtn').onclick=startExam;document.getElementById('resetAllBtn').onclick=()=>{showConfirm('Բոլոր թեստերի առաջընթացը, պատասխանները, սխալները և արդյունքները կջնջվեն։ Այս գործողությունը հնարավոր չէ հետարկել։',resetAllResults,'Զրոյացնե՞լ ամբողջ առաջընթացը։','Հաստատել')};applyTheme(document.documentElement.getAttribute('data-theme')||'light');document.querySelectorAll('.continue').forEach(b=>b.onclick=()=>startTest(b.dataset.test,true));document.querySelectorAll('.restart').forEach(b=>b.onclick=()=>{if(hasProgress(b.dataset.test)){showConfirm('Ընթացիկ առաջընթացը կջնջվի, և թեստը կսկսվի սկզբից։',()=>startTest(b.dataset.test,false));return}startTest(b.dataset.test,false)});
}
function renderQuiz(){
 const st=state(),qs=questions(),q=qs[st.index],ans=st.answers[String(st.index)],pct=((st.index+1)/qs.length)*100,answeredCount=Object.keys(st.answers||{}).length;
 const opts=q.options.map((text,i)=>{let cls='answer-btn',hint='';if(ans){cls+=' locked';if(ans.selected===i)cls+=' selected '+(ans.correct?'correct':'wrong');if(!ans.correct&&i===q.ans-1){cls+=' correct-reveal';hint='<span class="answer-correct-hint">✓ Ճիշտ պատասխան</span>'}}return `<button class="${cls}" data-option="${i}" type="button" ${ans?'disabled':''}><span class="answer-label">${i+1}</span><span class="answer-text">${escapeHtml(text)}</span>${hint}</button>`}).join('');
 const image=q.images_inline?.[0],imageHtml=image?`<div class="diagram-wrap"><img id="diagramImg" src="${image}" alt="Հարց ${q.n}-ի պատկերը"><div class="zoom-hint">${icons.zoom} Մեծացնել</div></div>`:'';
 const stateHtml=ans?`<span class="answer-state ${ans.correct?'correct':'wrong'}">${ans.correct?'✓ Ճիշտ պատասխան':'✕ Սխալ պատասխան'}</span>`:`<span class="answer-state">Ընտրիր պատասխան</span>`;
 document.getElementById('app').innerHTML=`<main class="screen"><div class="screen-inner"><div class="topbar"><button class="icon-btn" id="homeBtn" type="button" aria-label="Գլխավոր էջ">${icons.back}</button><div class="progress-wrap"><div class="progress-top"><span><strong>${current().title}</strong></span><span class="progress-meta"><span class="progress-count">${st.index+1} / ${qs.length}</span><span class="timer-pill"><span class="timer-dot"></span><span id="quizTimer">${formatTime(elapsedSeconds())}</span></span></span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div><div class="topbar-actions"><button class="theme-toggle" id="themeToggle" type="button" aria-label="Փոխել մուգ/լուսավոր ռեժիմը"></button></div></div><article class="question-card"><div class="question-inner"><div class="question-head"><div class="question-number">Հարց ${q.n}</div>${stateHtml}</div><div class="question-text">${escapeHtml(q.q)}</div>${imageHtml}<div class="answers">${opts}</div></div></article><div class="bottom-bar"><button class="nav-btn" id="prevBtn" type="button" ${st.index===0?'disabled':''}>← Հետ</button><button class="nav-btn primary" id="nextBtn" type="button" ${ans?'':'disabled'}>${st.index===qs.length-1?'Ավարտել':'Հաջորդ հարց →'}</button></div><div class="tip">Կարող ես նաև օգտագործել ստեղնաշարի 1–9 կոճակները և Enter-ը։</div></div></main>`;
 document.getElementById('homeBtn').onclick=goHome;document.getElementById('prevBtn').onclick=prevQuestion;document.getElementById('nextBtn').onclick=nextQuestion;document.getElementById('themeToggle').onclick=toggleTheme;applyTheme(document.documentElement.getAttribute('data-theme')||'light');document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>chooseAnswer(Number(b.dataset.option)));const img=document.getElementById('diagramImg');if(img)img.onclick=()=>openModal(img.src);startTimerUI();
}
function renderResult(){
 const st=state(),qs=questions(),total=qs.length,score=st.score,wrong=total-score,percent=Math.round(score/total*100);const label=percent>=90?'Գերազանց արդյունք':percent>=75?'Շատ լավ արդյունք':percent>=50?'Լավ առաջընթաց':'Կրկին փորձիր';
 const icon=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>`;
 document.getElementById('app').innerHTML=`<main class="screen"><div class="screen-inner"><div class="topbar"><button class="icon-btn" id="homeBtn" type="button" aria-label="Գլխավոր էջ">${icons.back}</button><div class="progress-wrap"><div class="progress-top"><span><strong>${current().title}</strong></span><span>Ավարտված է</span></div><div class="progress-track"><div class="progress-fill" style="width:100%"></div></div></div><div class="topbar-actions"><button class="theme-toggle" id="themeToggle" type="button" aria-label="Փոխել մուգ/լուսավոր ռեժիմը"></button></div></div><section class="result"><div class="result-hero"><div class="result-success-icon" aria-hidden="true">${icon}</div><div class="result-badge">Թեստն ավարտված է</div><h2>${label}</h2><p class="result-subtitle">Թեստի արդյունքը պատրաստ է։</p></div><div class="result-ring" style="--score:${percent}%"><span>${percent}%</span></div><div class="result-score-caption">Ճշգրտություն</div><div class="result-stats"><div class="result-stat"><strong>${score}</strong><span>Ճիշտ պատասխան</span></div><div class="result-stat wrong"><strong>${wrong}</strong><span>Սխալ պատասխան</span></div></div><div class="result-accuracy"><div class="result-accuracy-head"><span>Արդյունք</span><span>${score} / ${total} ճիշտ</span></div><div class="result-accuracy-track"><div class="result-accuracy-fill" style="width:${percent}%"></div></div></div><div class="result-actions"><button class="nav-btn primary" id="reviewBtn">Դիտել հարցերը</button><button class="nav-btn" id="retryBtn">Սկսել նորից</button></div><button class="menu-link" id="menuBtn">Գլխավոր էջ</button><div class="result-note">Կարող ես վերանայել բոլոր հարցերը կամ նորից անցնել թեստը։</div></section></div></main>`;
 document.getElementById('homeBtn').onclick=goHome;document.getElementById('themeToggle').onclick=toggleTheme;applyTheme(document.documentElement.getAttribute('data-theme')||'light');document.getElementById('retryBtn').onclick=()=>showConfirm('Այս թեստի արդյունքը և առաջընթացը կջնջվեն, և թեստը կսկսվի սկզբից։',()=>startTest(activeTest,false));document.getElementById('reviewBtn').onclick=()=>{state().index=0;state().view='quiz';save();render()};document.getElementById('menuBtn').onclick=goHome;
}
function setupKeyboard(){document.addEventListener('keydown',e=>{if(!activeTest||state()?.view!=='quiz')return;if(e.target&&['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(/^[1-9]$/.test(e.key)){const i=Number(e.key)-1;const q=questions()[state().index];if(i<q.options.length&&!state().answers[String(state().index)])chooseAnswer(i)}else if(e.key==='Enter'&&state().answers[String(state().index)])nextQuestion();else if(e.key==='ArrowLeft')prevQuestion();else if(e.key==='ArrowRight'&&state().answers[String(state().index)])nextQuestion()})}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c]))}
function render(){if(!activeTest||!state()||state().view==='home')renderHome();else if(state().view==='quiz')renderQuiz();else renderResult()}
document.getElementById('modalClose').onclick=closeModal;document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeConfirm()}});initTheme();load();render();
</script></body></html>
